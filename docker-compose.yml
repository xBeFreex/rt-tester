# Container logs are capped at 3 x 50 MB per container; without a limit the
# json-file driver grows without bound and fills the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  rt-tester:
    logging: *default-logging
    image: ghcr.io/xbefreex/rt-tester:latest
    build: .
    container_name: rt-tester
    restart: unless-stopped
    ports:
      - "5028:5028"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RT_TESTER_DB_PATH=/data/rt-tester.db
    volumes:
      - rt-tester-data:/data

volumes:
  rt-tester-data:
